spring.application.name=nexfleet-frota
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5p service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%m%n%wEx
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-message=never
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:frota}
management.endpoint.health.group.readiness.include=readinessState,mongo
services.identidade.url=${IDENTIDADE_URL:http://localhost:8081}
